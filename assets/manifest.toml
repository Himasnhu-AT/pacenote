# Every shipped asset: what it is, where it came from, how the car sim treats it, its LOD chain.
# Brief: docs/ASSETS_BRIEF.md §2. Checked by `python3 -I tools/assets/manifest.py check`
# (every file under assets/ is covered, every source is recorded); ATTRIBUTION.md is generated
# from this file and assets_src/SOURCES.md by `python3 -I tools/assets/manifest.py attribution`.
#
# Fields
#   paths      files (globs) under assets/ this entry covers
#   kind       texture_set | mesh | model | sound | text
#   sources    keys of entries in assets_src/SOURCES.md ("### Title (`key`)"), or "original"
#   credits    for sources not in SOURCES.md entries (sounds): title, author, url, licence
#   collision  none | solid_cylinder | breakable | brush  (how vehicle.rs sees it)
#   lod        the LOD chain, or what stands in for one today
#   built_by   the tool that produces the shipped files

