[package]
name = "pacenote"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Two-person rally: a driver who can't see the map and a guide who can't drive, talking over voice."

[dependencies]
engine = { path = "/Users/himanshu/codes/game/engine", default-features = false, features = ["look", "vfx", "pcg", "world", "net", "sound", "actions", "ktx2"] }
# Stage generation and pure game logic (no Bevy systems).
pcg-core = { path = "/Users/himanshu/codes/game/engine/crates/pcg-core" }
# Bevy derive macros expand to `bevy::ecs::..`, so the game names bevy itself (no features of
# its own: the engine picks them).
bevy = { version = "=0.19.1", default-features = false }
serde = { version = "1", features = ["derive"] }
ron = "0.12"

[features]
default = ["dev"]
dev = ["engine/devtools", "engine/trace", "engine/devkit"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
strip = true
debug = false
lto = "thin"
codegen-units = 1
