[package]
name = "pacenote"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Two-person rally: a driver who can't see the map and a guide who can't drive, talking over voice."

[dependencies]
engine = { path = "/Users/himanshu/codes/game/engine-pacenote-editor", default-features = false, features = ["level", "spline", "look", "vfx", "pcg", "world", "net", "sound", "actions", "props", "ktx2"] }
# Stage generation and pure game logic (no Bevy systems).
pcg-core = { path = "/Users/himanshu/codes/game/engine-pacenote-editor/crates/pcg-core" }
# Bevy derive macros expand to `bevy::ecs::..`, so the game names bevy itself (no features of
# its own: the engine picks them).
bevy = { version = "=0.20.1", default-features = false }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# Microphone capture for voice chat (same version rodio already pulls in: no new copy).
cpal = "0.17.3"
serde_json = "1"
# Bit-identical sin / cos / atan2 on every platform (std libm differs between Apple arm64 and
# x86_64): the car sim uses it so ghosts replay the same everywhere. Already in the tree.
libm = "0.2"
# Only for the tracer's consent categories: the same crate (and revision) the engine uses.
ashlar-trace = { git = "https://github.com/Himasnhu-AT/ashlar", rev = "561745aaf96e07a0efe2ed61f37b0a365f46a530", default-features = false, optional = true }

[features]
default = ["dev"]
dev = ["engine/editor", "engine/devtools", "engine/devkit", "telemetry"]
# Anonymous stats and crash reports (docs/TELEMETRY.md). Ship builds: `--no-default-features
# --features telemetry`, with PACENOTE_TRACE_ENDPOINT / PACENOTE_TRACE_KEY set at build time.
telemetry = ["engine/trace", "dep:ashlar-trace"]
# The free demo: three stages, wishlist prompts (src/demo.rs). PACENOTE_STEAM_URL at build time.
demo = []

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
strip = true
debug = false
lto = "thin"
codegen-units = 1
