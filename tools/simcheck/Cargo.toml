[package]
name = "simcheck"
version = "0.0.0"
edition = "2024"
publish = false

# Compiles the game's own src/vehicle.rs and src/stage.rs (no copies) without Bevy, so the
# same code builds in seconds for arm64 and x86_64. See tools/simcheck/run.sh.
[dependencies]
bevy = { path = "bevyshim" }
pcg-core = { git = "https://github.com/himasnhu-AT/hull-dep", rev = "caf33e1887e106de3409c7796d0e244bfa30858e" }
serde = { version = "1", features = ["derive"] }
libm = "0.2"

[workspace]
